version: '3.9'
services:
  backend:
    build: ./backend
    environment:
      - PORT=4000
      - PASSWORD=${PASSWORD:-changeme}
      - DB_PATH=/data/notes.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - REMIX_DAILY_LIMIT=${REMIX_DAILY_LIMIT:-25}
      # Host nginx + the frontend's nginx: lets the remix limit see the real client IP
      - TRUST_PROXY=2
    volumes:
      - notes_data:/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    # Serves the app and proxies /api to the backend. Localhost only: on the box the host nginx
    # terminates TLS in front of this. 8086 is claimed in the port registry in
    # theted/infrastructure (the-box.md).
    ports:
      - '127.0.0.1:8086:80'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  notes_data:
